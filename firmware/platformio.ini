; DIY Phone firmware - ESP32-S3-WROOM-1-N16R8 on the DIY phone mainboard.
;
;   pio run -e phone -t upload      build + flash over the USB-C port
;   pio device monitor -e phone     serial console (115200)
;   pio test -e native              run the PhoneCore unit tests on your PC

[platformio]
default_envs = phone

[env:phone]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI configuration (replaces User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTOUCH_CS=47
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    ; ~100 mm of SPI trace to the display socket: stay conservative
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
