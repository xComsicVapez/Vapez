settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: false
  deprecated-verbose: default
  shutdown-message: Vapez SMP is rebooting. Rejoin in a moment.
  minimum-api: auto
  use-map-color-cache: true
spawn-limits:
  monsters: 25
  animals: 8
  water-animals: 3
  water-underground-creature: 3
  water-ambient: 1
  axolotls: 3
  ambient: 1
chunk-gc:
  period-in-ticks: 400
ticks-per:
  animal-spawns: 400
  monster-spawns: 10
  water-spawns: 20
  water-ambient-spawns: 20
  water-underground-creature-spawns: 20
  axolotl-spawns: 20
  ambient-spawns: 20
  autosave: 6000
aliases: now-in-commands.yml
