# Optimized for Purpur 1.21.8 + 60G Generational ZGC. Missing keys fall back to Paper defaults.
_version: 30
world-settings:
  default:
    below-zero-generation-in-existing-chunks: true
    view-distance: default
    simulation-distance: default
    mob-spawn-range: 6
    item-despawn-rate: 3000
    merge-radius:
      item: 4.0
      exp: 6.0
    arrow-despawn-rate: 300
    trident-despawn-rate: 300
    zombie-aggressive-towards-villager: true
    nerf-spawner-mobs: true
    enable-zombie-pigmen-portal-spawns: true
    wither-spawn-sound-radius: 0
    hanging-tick-frequency: 100
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 64
    hopper-can-load-chunks: false
    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
    seed-monument: 10387313
    seed-shipwreck: 165745295
    seed-ocean: 14357621
    seed-outpost: 165745296
    seed-endcity: 10387313
    seed-slime: 987234911
    seed-nether: 30084232
    seed-mansion: 10387319
    seed-fossil: 14357921
    seed-portal: 34222645
    seed-ancientcity: 200032270
    seed-trailruins: 83469867
    seed-trialchambers: 94251327
    seed-buriedtreasure: 10387320
    seed-mineshaft: default
    seed-stronghold: default
    max-tnt-per-tick: 50
    hanging-tick-frequency: 100
settings:
  debug: false
  save-user-cache-on-stop-only: true
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  netty-threads: 8
  attribute:
    maxHealth:
      max: 1024.0
    movementSpeed:
      max: 1024.0
    attackDamage:
      max: 1024.0
  player-shuffle: 0
  user-cache-size: 2000
  bungeecord: false
  sample-count: 12
  player-sample-count: 12
  log-villager-deaths: false
  log-named-deaths: false
  entity-tracking-range:
    players: 48
    animals: 48
    monsters: 48
    misc: 32
    display: 128
    other: 64
  ticks-per:
    hopper-transfer: 8
    hopper-check: 8
  hopper-amount: 64
messages:
  whitelist: You are not whitelisted on Vapez SMP.
  unknown-command: Unknown command. Type "/help" for help.
  server-full: Vapez SMP is full. Try again shortly.
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
  restart: Vapez SMP is restarting...
advancements:
  disable-saving: false
  disabled:
    - minecraft:story/disabled
players:
  disable-saving: false
config-version: 12
stats:
  disable-saving: false
  forced-stats: {}
commands:
  silent-commandblock-console: false
  replace-commands:
    - setblock
    - summon
    - testforblock
    - tellraw
  spam-exclusions:
    - /skill
  log: true
  tab-complete: 0
  send-namespaced: true
  hide-overridden-commands-from-help: true
watchdog:
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
growth:
  cactus-modifier: 100
  cane-modifier: 100
  melon-modifier: 100
  mushroom-modifier: 100
