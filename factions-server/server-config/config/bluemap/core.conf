# BlueMap web map (http://<server>:8100), with faction claims drawn by the Factions mod.
# Accepting the download lets BlueMap fetch Minecraft's client textures; it's covered by
# the same Minecraft EULA you accept for the server.
accept-download: true
data: "bluemap"
render-thread-count: 2
scan-for-mod-resources: true
metrics: false
log: {
  file: "bluemap/logs/debug.log"
  append: false
}
